[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-project-bootstrap"
version = "0.1.0"
description = "Portable, profile-driven workspace validation, bootstrap, and routing primitives."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
